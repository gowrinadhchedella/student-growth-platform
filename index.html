<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Student Growth Platform – Telangana</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--primary:#6C63FF;--primary-dark:#4D44DB;--primary-light:#EEF0FF;
--secondary:#FF6584;--accent:#43D9A2;--warn:#F6C90E;
--bg:#F5F6FF;--card:#fff;--sidebar:#1A1A2E;
--text:#1A1A2E;--muted:#6B7280;--border:#E5E7EB;
--success:#10B981;--danger:#EF4444;
font-family:'Nunito',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Sora',sans-serif}
.hidden{display:none!important}

/* ── LAYOUT ── */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:.3s}
.sidebar-logo{padding:20px 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.sidebar-logo span{font-size:13px;font-weight:700;line-height:1.3;color:#fff;opacity:.9}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;transition:.2s;border-radius:8px;margin:2px 8px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.65)}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ni{font-size:16px;width:20px;text-align:center}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.avatar.lg{width:48px;height:48px;font-size:17px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.main-content{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.page-content{padding:24px;flex:1}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-subtitle{font-size:13px;color:var(--muted)}

/* ── AUTH PAGES ── */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EEF0FF 0%,#FFF1F5 50%,#EDFCF6 100%);padding:20px}
.auth-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(108,99,255,.12)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.auth-logo .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;font-family:'Sora',sans-serif}
.auth-logo .logo-text{font-size:14px;font-weight:700;font-family:'Sora',sans-serif;line-height:1.3}
.auth-card h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-card p{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;font-family:'Nunito',sans-serif;outline:none;transition:.2s;background:#fff;color:var(--text)}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.form-group.error input{border-color:var(--danger)}
.form-error{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;border:none;transition:.2s;font-family:'Nunito',sans-serif}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--primary-light);color:var(--primary)}
.btn-secondary:hover{background:#dde0ff}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-full{width:100%}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-danger{background:#FEE2E2;color:var(--danger)}
.btn-success{background:#D1FAE5;color:var(--success)}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── LANDING PAGE ── */
.landing{min-height:100vh;background:#fff}
.landing-nav{display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:68px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:100}
.landing-nav .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.landing-nav .logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;font-family:'Sora',sans-serif}
.landing-nav .logo span{font-size:15px;font-weight:800;font-family:'Sora',sans-serif}
.hero{padding:80px 60px 60px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;max-width:1200px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:20px}
.hero h1{font-size:42px;font-weight:800;line-height:1.15;margin-bottom:16px;color:var(--text)}
.hero h1 span{color:var(--primary)}
.hero p{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:28px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-stats{display:flex;gap:24px;margin-top:32px}
.stat-item{text-align:center}
.stat-item strong{display:block;font-size:22px;font-weight:800;color:var(--primary)}
.stat-item span{font-size:11.5px;color:var(--muted);font-weight:600}
.hero-visual{background:linear-gradient(135deg,#EEF0FF,#FFF1F5);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px}
.mini-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.mini-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-card-title{font-size:12.5px;font-weight:700}
.progress-bar-wrap{background:#F3F4F6;border-radius:6px;height:7px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:6px;transition:.4s}
.pb-primary{background:linear-gradient(90deg,var(--primary),#9B8FFF)}
.pb-success{background:linear-gradient(90deg,var(--accent),#0EA5E9)}
.pb-warn{background:linear-gradient(90deg,var(--warn),#F97316)}
.categories-section{padding:60px 60px;background:#F8F9FF;border-top:1px solid var(--border)}
.categories-section h2{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px}
.categories-section p{text-align:center;color:var(--muted);margin-bottom:32px;font-size:14px}
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:0 auto}
.cat-card{background:#fff;border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.cat-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.cat-icon{font-size:28px;margin-bottom:10px}
.cat-card h4{font-size:13.5px;font-weight:700;margin-bottom:4px}
.cat-card span{font-size:11.5px;color:var(--muted)}
.features-section{padding:60px 60px;max-width:1200px;margin:0 auto}
.features-section h2{font-size:28px;font-weight:800;text-align:center;margin-bottom:40px}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.feat-card{background:#fff;border-radius:16px;padding:24px;border:1.5px solid var(--border)}
.feat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.feat-card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.feat-card p{font-size:13px;color:var(--muted);line-height:1.6}
.landing-footer{padding:32px 60px;border-top:1px solid var(--border);background:#1A1A2E;color:rgba(255,255,255,.5);text-align:center;font-size:13px}
.landing-footer strong{color:rgba(255,255,255,.9)}

/* ── ONBOARDING ── */
.onboarding-page{min-height:100vh;background:linear-gradient(135deg,#EEF0FF 0%,#FFF1F5 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.onboarding-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(108,99,255,.12)}
.step-indicator{display:flex;gap:8px;margin-bottom:28px;justify-content:center}
.step-dot{width:32px;height:6px;border-radius:3px;background:var(--border);transition:.3s}
.step-dot.active{background:var(--primary)}
.step-dot.done{background:var(--accent)}
.onboarding-card h2{font-size:21px;font-weight:800;margin-bottom:6px;text-align:center}
.onboarding-card p{color:var(--muted);font-size:13.5px;text-align:center;margin-bottom:24px}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.option-btn{padding:14px;border-radius:12px;border:2px solid var(--border);cursor:pointer;text-align:center;transition:.2s;background:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:13.5px;color:var(--text)}
.option-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.option-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.option-btn .ob-icon{font-size:24px;display:block;margin-bottom:6px}
.interests-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.interest-tag{padding:8px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:.2s;background:#fff}
.interest-tag.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}

/* ── DASHBOARD ── */
.welcome-banner{background:linear-gradient(135deg,var(--primary),#9B8FFF);border-radius:18px;padding:24px 28px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.welcome-banner::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.welcome-banner::after{content:'';position:absolute;bottom:-20px;right:60px;width:80px;height:80px;background:rgba(255,255,255,.06);border-radius:50%}
.welcome-banner h2{font-size:22px;font-weight:800;margin-bottom:4px}
.welcome-banner p{font-size:13.5px;opacity:.85}
.welcome-banner .streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;margin-top:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border-radius:16px;padding:20px;border:1.5px solid var(--border)}
.card-title{font-size:14.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.metric-card{background:var(--card);border-radius:14px;padding:18px;border:1.5px solid var(--border);text-align:center}
.metric-card .value{font-size:28px;font-weight:800;font-family:'Sora',sans-serif;color:var(--primary)}
.metric-card .label{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.module-card{background:var(--card);border-radius:14px;border:1.5px solid var(--border);overflow:hidden;cursor:pointer;transition:.2s}
.module-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.module-thumb{height:100px;display:flex;align-items:center;justify-content:center;font-size:40px}
.module-body{padding:14px}
.module-subject{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--primary);margin-bottom:4px}
.module-title{font-size:13.5px;font-weight:700;margin-bottom:8px;line-height:1.3}
.module-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700}
.badge-primary{background:var(--primary-light);color:var(--primary)}
.badge-success{background:#D1FAE5;color:var(--success)}
.badge-warn{background:#FEF3C7;color:#D97706}
.badge-danger{background:#FEE2E2;color:var(--danger)}
.badge-gray{background:#F3F4F6;color:var(--muted)}
.progress-list .progress-item{margin-bottom:16px}
.progress-item .pi-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:700}
.progress-item .pi-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.daily-goal-list{display:flex;flex-direction:column;gap:10px}
.dg-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#F9FAFB;border-radius:10px;cursor:pointer;transition:.2s}
.dg-item:hover{background:var(--primary-light)}
.dg-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.dg-check.done{background:var(--accent);border-color:var(--accent);color:#fff}
.dg-item .dg-text{font-size:13px;font-weight:600}
.dg-item .dg-pts{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--primary)}
.weak-area-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.weak-area-item:last-child{border-bottom:none}
.wa-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.wa-info{flex:1}
.wa-info h4{font-size:13.5px;font-weight:700}
.wa-info span{font-size:11.5px;color:var(--muted)}
.recommended-section{margin-top:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:16px;font-weight:800}

/* ── MODULE PAGE ── */
.module-page-layout{display:grid;grid-template-columns:1fr 360px;gap:24px}
.lesson-content{background:#fff;border-radius:16px;border:1.5px solid var(--border);overflow:hidden}
.lesson-header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.lesson-nav{display:flex;align-items:center;gap:8px}
.lesson-breadcrumb{font-size:12.5px;color:var(--muted)}
.lesson-body{padding:28px}
.lesson-body h2{font-size:21px;font-weight:800;margin-bottom:16px}
.lesson-body h3{font-size:16px;font-weight:700;margin:20px 0 10px;color:var(--primary)}
.lesson-body p{font-size:14px;line-height:1.8;color:var(--text);margin-bottom:14px}
.lesson-body ul{margin:10px 0 14px 20px}
.lesson-body li{font-size:14px;line-height:1.8;margin-bottom:4px}
.example-box{background:#F8F9FF;border-left:4px solid var(--primary);border-radius:0 12px 12px 0;padding:16px 18px;margin:20px 0}
.example-box h4{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
.example-box p{font-size:13.5px;line-height:1.7;margin:0}
.lesson-footer{padding:20px 28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notes-panel{background:#fff;border-radius:16px;border:1.5px solid var(--border);padding:20px;max-height:calc(100vh - 140px);overflow-y:auto}
.notes-panel h3{font-size:15px;font-weight:800;margin-bottom:14px}
.notes-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:13px;font-family:'Nunito',sans-serif;resize:vertical;min-height:100px;outline:none}
.notes-textarea:focus{border-color:var(--primary)}
.notes-list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.note-item{background:#F9FAFB;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;position:relative}
.note-item .note-time{font-size:11px;color:var(--muted);margin-top:6px}
.chapter-list{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.chapter-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s;font-size:13px;font-weight:600}
.chapter-item:hover{background:#F3F4F6}
.chapter-item.active{background:var(--primary-light);color:var(--primary)}
.chapter-item.completed{color:var(--success)}
.chapter-num{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.chapter-item.active .chapter-num{background:var(--primary);border-color:var(--primary);color:#fff}
.chapter-item.completed .chapter-num{background:var(--success);border-color:var(--success);color:#fff}

/* ── QUIZ PAGE ── */
.quiz-header{background:#fff;border-radius:16px;padding:20px 24px;border:1.5px solid var(--border);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.quiz-progress-info{display:flex;align-items:center;gap:16px}
.timer-circle{width:56px;height:56px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-direction:column}
.timer-circle .timer-val{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;color:var(--primary)}
.timer-circle .timer-lbl{font-size:9px;color:var(--muted);font-weight:700}
.timer-circle.urgent{background:#FEE2E2}
.timer-circle.urgent .timer-val{color:var(--danger)}
.question-card{background:#fff;border-radius:16px;padding:28px;border:1.5px solid var(--border);margin-bottom:16px}
.question-num{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.question-text{font-size:17px;font-weight:700;margin-bottom:24px;line-height:1.5}
.options-grid{display:flex;flex-direction:column;gap:10px}
.option-choice{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:.2s;font-size:14px;font-weight:600}
.option-choice:hover{border-color:var(--primary);background:var(--primary-light)}
.option-choice.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.option-choice.correct{border-color:var(--success);background:#D1FAE5;color:var(--success)}
.option-choice.wrong{border-color:var(--danger);background:#FEE2E2;color:var(--danger)}
.option-letter{width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.explanation-box{background:#F0FDF4;border-left:4px solid var(--success);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:14px}
.explanation-box.wrong-ex{background:#FFF5F5;border-left-color:var(--danger)}
.explanation-box h4{font-size:12.5px;font-weight:800;color:var(--success);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.explanation-box.wrong-ex h4{color:var(--danger)}
.explanation-box p{font-size:13.5px;line-height:1.6;margin:0}
.quiz-result{background:#fff;border-radius:20px;padding:40px;border:1.5px solid var(--border);text-align:center}
.result-circle{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;flex-direction:column}
.result-circle.good{background:linear-gradient(135deg,#D1FAE5,#A7F3D0)}
.result-circle.avg{background:linear-gradient(135deg,#FEF3C7,#FDE68A)}
.result-circle.poor{background:linear-gradient(135deg,#FEE2E2,#FECACA)}
.result-score{font-size:36px;font-weight:800;font-family:'Sora',sans-serif}
.result-circle.good .result-score{color:var(--success)}
.result-circle.avg .result-score{color:#D97706}
.result-circle.poor .result-score{color:var(--danger)}
.result-stats{display:flex;justify-content:center;gap:32px;margin:24px 0}
.rs-item{text-align:center}
.rs-item strong{display:block;font-size:21px;font-weight:800;font-family:'Sora',sans-serif}
.rs-item span{font-size:12px;color:var(--muted);font-weight:600}

/* ── ANALYTICS PAGE ── */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.analytics-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.insight-card{background:#fff;border-radius:14px;padding:16px;border:1.5px solid var(--border)}
.insight-card .i-val{font-size:24px;font-weight:800;font-family:'Sora',sans-serif}
.insight-card .i-lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.insight-card .i-change{font-size:12px;font-weight:700;margin-top:4px}
.change-up{color:var(--success)}
.change-dn{color:var(--danger)}
.subject-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subject-row .sub-name{width:80px;font-size:13px;font-weight:700;flex-shrink:0}
.subject-row .sub-bar-wrap{flex:1;background:#F3F4F6;border-radius:6px;height:9px;overflow:hidden}
.subject-row .sub-bar{height:100%;border-radius:6px}
.subject-row .sub-pct{width:38px;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted)}

/* ── GAMIFICATION ── */
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge-card{background:#fff;border-radius:14px;padding:16px;border:1.5px solid var(--border);text-align:center}
.badge-icon-lg{font-size:32px;margin-bottom:8px}
.badge-card h4{font-size:12.5px;font-weight:700;margin-bottom:4px}
.badge-card span{font-size:11px;color:var(--muted)}
.badge-card.locked{opacity:.45;filter:grayscale(1)}
.leaderboard-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:#F9FAFB}
.leaderboard-item.me{background:var(--primary-light)}
.rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#F6C90E,#F97316);color:#fff}
.rank-2{background:linear-gradient(135deg,#9CA3AF,#6B7280);color:#fff}
.rank-3{background:linear-gradient(135deg,#CD7F32,#92400E);color:#fff}
.rank-other{background:#E5E7EB;color:var(--muted)}

/* ── ADMIN ── */
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.admin-table{background:#fff;border-radius:14px;border:1.5px solid var(--border);overflow:hidden}
.admin-table table{width:100%;border-collapse:collapse}
.admin-table th{background:#F9FAFB;padding:12px 16px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
.admin-table td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--border)}
.admin-table tr:last-child td{border-bottom:none}
.admin-table tr:hover td{background:#F9FAFB}
.toggle-btns{display:flex;background:#F3F4F6;border-radius:10px;padding:3px;gap:2px}
.toggle-btn{padding:7px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:.2s;font-family:'Nunito',sans-serif}
.toggle-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.search-input{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;background:#fff;flex:1}
.search-input input{border:none;outline:none;font-size:13.5px;font-family:'Nunito',sans-serif;flex:1;color:var(--text)}
.notif{position:fixed;top:20px;right:20px;background:var(--sidebar);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:9999;animation:slideIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.notif.success-notif{background:var(--success)}
.notif.warn-notif{background:#D97706}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.points-animation{position:fixed;pointer-events:none;z-index:9999;font-size:20px;font-weight:800;color:var(--warn);animation:floatUp 1.5s ease forwards}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px);opacity:0}}
.lang-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang-toggle.active{color:var(--primary)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--primary-light);color:var(--primary);cursor:pointer}
.chip.inactive{background:#F3F4F6;color:var(--muted)}
.tooltip{position:relative;display:inline-block}
.tooltip-text{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--sidebar);color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:.15s;z-index:200}
.tooltip:hover .tooltip-text{opacity:1}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
@media(max-width:900px){
  .main-content{margin-left:0}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hero{grid-template-columns:1fr;padding:40px 20px}
  .hero-visual{display:none}
  .cats-grid{grid-template-columns:repeat(2,1fr)}
  .features-grid{grid-template-columns:1fr}
  .landing-nav{padding:0 20px}
  .categories-section,.features-section{padding:40px 20px}
  .grid-3,.grid-4,.analytics-grid,.analytics-grid-3{grid-template-columns:1fr 1fr}
  .module-page-layout{grid-template-columns:1fr}
  .admin-stats{grid-template-columns:1fr 1fr}
  .badges-grid{grid-template-columns:repeat(2,1fr)}
}

const MODULES_DATA = [
  {id:1,subject:'Mathematics',class:10,title:'Quadratic Equations',content:`<h3>What are Quadratic Equations?</h3><p>A quadratic equation is a second-order polynomial equation with a single variable x. The general form is: <strong>ax² + bx + c = 0</strong>, where a ≠ 0.</p><p>Quadratic equations are fundamental in algebra and have applications in physics, engineering, and economics.</p><h3>Methods of Solving</h3><ul><li>Factorisation method</li><li>Completing the square</li><li>Quadratic formula: x = (-b ± √(b²-4ac)) / 2a</li></ul>`,example:'Solve x² - 5x + 6 = 0. Factoring: (x-2)(x-3) = 0. So x = 2 or x = 3.',icon:'📐',color:'#EEF0FF',chapters:['Introduction','Factorisation','Completing Square','Quadratic Formula','Word Problems'],difficulty:'Medium'},
  {id:2,subject:'Science',class:10,title:'Chemical Reactions',content:`<h3>Types of Chemical Reactions</h3><p>A chemical reaction is a process that leads to the chemical transformation of one set of chemical substances to another.</p><p>The main types include combination reactions, decomposition reactions, displacement reactions, and redox reactions.</p><h3>Balancing Equations</h3><p>To balance a chemical equation, ensure the number of atoms of each element is equal on both sides of the equation.</p>`,example:'2H₂ + O₂ → 2H₂O is a combination reaction where hydrogen and oxygen combine to form water.',icon:'⚗️',color:'#F0FDF4',chapters:['Types of Reactions','Balancing Equations','Acids & Bases','Redox Reactions','Electrolysis'],difficulty:'Hard'},
  {id:3,subject:'History',class:9,title:'Nationalist Movement',content:`<h3>Rise of Nationalism in India</h3><p>Indian nationalism emerged in the late 19th century as a response to British colonial rule. The Indian National Congress was founded in 1885.</p><p>Key leaders like Bal Gangadhar Tilak, Gopal Krishna Gokhale, and later Mahatma Gandhi shaped the movement.</p><h3>Non-Cooperation Movement</h3><p>Launched in 1920 by Gandhi, the Non-Cooperation Movement was a mass movement against British rule.</p>`,example:'The Swadeshi Movement (1905) encouraged Indians to boycott British goods and use Indian-made products.',icon:'🏛️',color:'#FFF7ED',chapters:['Early Nationalism','Congress Formation','Partition of Bengal','Non-Cooperation','Civil Disobedience'],difficulty:'Easy'},
  {id:4,subject:'English',class:8,title:'Parts of Speech',content:`<h3>Understanding Grammar</h3><p>Parts of speech are the categories into which words are classified according to their functions in sentences. There are 8 main parts of speech in English.</p><h3>Key Parts of Speech</h3><ul><li><strong>Noun</strong>: Names a person, place, thing, or idea</li><li><strong>Verb</strong>: Expresses action or state of being</li><li><strong>Adjective</strong>: Describes a noun</li><li><strong>Adverb</strong>: Modifies a verb, adjective, or other adverb</li></ul>`,example:'"The quick brown fox jumps over the lazy dog" – Here "quick" and "brown" are adjectives, "jumps" is a verb, "over" is a preposition.',icon:'📚',color:'#FFF1F5',chapters:['Nouns & Pronouns','Verbs','Adjectives','Adverbs','Conjunctions'],difficulty:'Easy'},
  {id:5,subject:'Mathematics',class:12,title:'Calculus – Derivatives',content:`<h3>Introduction to Derivatives</h3><p>Derivatives measure how a function changes as its input changes. The derivative of f(x) is denoted f'(x) or dy/dx.</p><p>The fundamental theorem: if y = xⁿ, then dy/dx = nxⁿ⁻¹</p><h3>Chain Rule</h3><p>The chain rule states: d/dx[f(g(x))] = f'(g(x)) · g'(x)</p>`,example:"If f(x) = x³ + 2x² - 5x + 1, then f'(x) = 3x² + 4x - 5",icon:'∫',color:'#EEF0FF',chapters:['Limits','First Principles','Standard Derivatives','Chain Rule','Applications'],difficulty:'Hard'},
  {id:6,subject:'Physics',class:11,title:'Laws of Motion',content:`<h3>Newton's Three Laws</h3><p>Newton's laws of motion describe the relationship between a body and the forces acting upon it, and its motion in response to those forces.</p><h3>First Law – Inertia</h3><p>An object remains at rest or in uniform motion unless acted upon by an external force.</p><h3>Second Law – F = ma</h3><p>The net force on an object equals its mass times its acceleration: F = ma</p>`,example:'A car of mass 1000 kg accelerates at 2 m/s². The force required = 1000 × 2 = 2000 N',icon:'⚡',color:'#F0F9FF',chapters:['Inertia','F = ma','Action-Reaction','Friction','Circular Motion'],difficulty:'Medium'},
];

const TELUGU = {
  dashboard:'డాష్‌బోర్డ్',modules:'అధ్యయన విభాగాలు',analytics:'విశ్లేషణలు',
  quiz:'క్విజ్',profile:'ప్రొఫైల్',admin:'అడ్మిన్',

};

let state = {
  page: DB.currentUser ? (DB.currentUser.onboarded?'dashboard':'onboarding') : 'landing',
  user: DB.currentUser,
  lang: 'en',
  currentModule: null,
  currentChapter: 0,
  quizSubject: 'math',
  quizQ: 0,
  quizAnswers: [],
  quizSelected: null,
  quizShownExpl: false,
  quizDone: false,
  quizTimer: 30,
  quizTimerInt: null,
  analyticsToggle: 'weekly',
  completedModules: new Set(JSON.parse(localStorage.getItem('sgp_completed')||'[]')),
  notes: JSON.parse(localStorage.getItem('sgp_notes')||'{}'),
  dailyGoals: JSON.parse(localStorage.getItem('sgp_goals')||'[false,false,false,false]'),
  points: parseInt(localStorage.getItem('sgp_points')||'1890'),
  streak: parseInt(localStorage.getItem('sgp_streak')||'7'),
  onboardData: {class:'',medium:'',interests:[],goal:''},
  signupErrors:{},loginErrors:{},
  sidebarOpen: false,
  chartInstances: {},
  adminTab: 'users',
};

function saveState(){
  localStorage.setItem('sgp_completed',JSON.stringify([...state.completedModules]));
  localStorage.setItem('sgp_notes',JSON.stringify(state.notes));
  localStorage.setItem('sgp_goals',JSON.stringify(state.dailyGoals));
  localStorage.setItem('sgp_points',state.points);
  localStorage.setItem('sgp_streak',state.streak);
}

function navigate(page, extra={}){
  if(state.quizTimerInt){clearInterval(state.quizTimerInt);state.quizTimerInt=null}
  Object.assign(state,{page,...extra});
  render();
  window.scrollTo(0,0);
  if(page==='analytics')setTimeout(renderCharts,200);
  if(page==='quiz')startQuizTimer();
}

function showNotif(msg,type=''){
  const el=document.createElement('div');
  el.className=`notif${type?' '+type+'-notif':''}`;
  el.textContent=msg;
  document.getElementById('notif-container').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function showPoints(pts, el){
  const r=el?el.getBoundingClientRect():{top:200,left:200};
  const d=document.createElement('div');
  d.className='points-animation';
  d.textContent=`+${pts} pts`;
  d.style.cssText=`left:${r.left+20}px;top:${r.top}px`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1600);
}

function getGreeting(){
  const h=new Date().getHours();
  if(h<12)return state.lang==='te'?TELUGU.goodMorning:'Good Morning';
  if(h<17)return state.lang==='te'?TELUGU.goodAfternoon:'Good Afternoon';
  return state.lang==='te'?TELUGU.goodEvening:'Good Evening';
}

function hashPass(p){let h=0;for(let c of p){h=((h<<5)-h)+c.charCodeAt(0);h|=0}return h.toString(16)}

function validateSignup(data){
  const e={};
  if(!data.name||data.name.length<2)e.name='Name must be at least 2 characters';
  if(!data.email||!/^[^@]+@[^@]+\.[^@]+$/.test(data.email))e.email='Valid email required';
  if(!data.password||data.password.length<6)e.password='Password must be at least 6 characters';
  if(data.password!==data.confirmPassword)e.confirmPassword='Passwords do not match';
  if(DB.users.find(u=>u.email===data.email))e.email='Email already registered';
  return e;
}

function doSignup(){
  const data={
    name:document.getElementById('su-name').value.trim(),
    email:document.getElementById('su-email').value.trim(),
    password:document.getElementById('su-pass').value,
    confirmPassword:document.getElementById('su-cpass').value,
  };
  const errors=validateSignup(data);
  if(Object.keys(errors).length){state.signupErrors=errors;render();return}
  const user={id:Date.now(),name:data.name,email:data.email,password:hashPass(data.password),onboarded:false,role:'student',joinDate:new Date().toISOString().split('T')[0]};
  DB.users.push(user);DB.currentUser=user;DB.save();
  state.user=user;state.signupErrors={};
  navigate('onboarding');
}

function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const errors={};
  if(!email)errors.email='Email required';
  if(!pass)errors.password='Password required';
  if(!Object.keys(errors).length){
    const user=DB.users.find(u=>u.email===email&&u.password===hashPass(pass));
    if(!user){errors.email='Invalid email or password'}
    else{
      DB.currentUser=user;DB.save();state.user=user;state.loginErrors={};
      navigate(user.onboarded?'dashboard':'onboarding');return;
    }
  }
  state.loginErrors=errors;render();
}

function doLogout(){
  DB.currentUser=null;DB.save();state.user=null;navigate('landing');
}

function doOnboarding(){
  const d=state.onboardData;
  if(!d.class||!d.medium||!d.goal){showNotif('Please complete all fields','warn');return}
  const u=DB.users.find(u=>u.id===state.user.id);
  if(u){u.onboarded=true;u.profile=d;DB.currentUser=u;DB.save();state.user=u}
  navigate('dashboard');showNotif('Welcome to your personalized dashboard! ','success');
}

function startQuizTimer(){
  state.quizTimer=30;state.quizShownExpl=false;state.quizSelected=null;
  if(state.quizTimerInt)clearInterval(state.quizTimerInt);
  state.quizTimerInt=setInterval(()=>{
    if(state.quizDone)return;
    state.quizTimer--;
    const el=document.querySelector('.timer-val');
    if(el)el.textContent=state.quizTimer;
    const circle=document.querySelector('.timer-circle');
    if(circle)circle.className='timer-circle'+(state.quizTimer<=10?' urgent':'');
    if(state.quizTimer<=0){
      clearInterval(state.quizTimerInt);
      if(!state.quizShownExpl){
        state.quizAnswers.push(-1);
        if(state.quizQ<questions.length-1){state.quizQ++;startQuizTimer();render()}
        else{state.quizDone=true;clearInterval(state.quizTimerInt);render()}
      }
    }
  },1000);
}

function selectQuizAnswer(idx){
  if(state.quizShownExpl)return;
  state.quizSelected=idx;state.quizShownExpl=true;
  clearInterval(state.quizTimerInt);
  const correct=idx===questions[state.quizQ].ans;
  if(correct){state.points+=20;showPoints(20,document.querySelector('.option-choice.selected'));saveState()}
  state.quizAnswers.push(idx);
  render();
}

function nextQuizQuestion(){
  if(state.quizQ<questions.length-1){
    state.quizQ++;state.quizShownExpl=false;state.quizSelected=null;
    render();startQuizTimer();
  }else{
    state.quizDone=true;clearInterval(state.quizTimerInt);
    const score=state.quizAnswers.filter((a,i)=>a===questions[i].ans).length;
    const pct=Math.round(score/questions.length*100);
    if(pct>=80){state.points+=100;saveState();showNotif('🏆 Excellent! +100 bonus points!','success')}
    else if(pct>=60){state.points+=50;saveState();showNotif('👍 Good job! +50 bonus points!','success')}
    render();
  }
}

function toggleGoal(i){
  const was=state.dailyGoals[i];
  state.dailyGoals[i]=!was;
  if(!was){state.points+=10;showPoints(10);saveState();showNotif('Daily goal completed! +10 pts 🎯','success')}
  else{saveState()}
  render();
}

function markComplete(moduleId){
  state.completedModules.add(moduleId);
  state.points+=50;saveState();
  showNotif('Module completed! +50 points 🎉','success');
  showPoints(50);
  render();
}

function addNote(){
  const ta=document.getElementById('note-input');
  if(!ta||!ta.value.trim())return;
  const key=`m${state.currentModule.id}`;
  if(!state.notes[key])state.notes[key]=[];
  state.notes[key].unshift({text:ta.value.trim(),time:new Date().toLocaleTimeString()});
  saveState();ta.value='';render();
}

function destroyCharts(){

function render(){
  document.getElementById('root').innerHTML = buildPage();

function buildPage(){
  switch(state.page){
    case 'landing': return buildLanding();
    case 'signup': return buildSignup();
    case 'login': return buildLogin();
    case 'onboarding': return buildOnboarding();
    case 'dashboard': return buildShell(buildDashboard());
    case 'modules': return buildShell(buildModules());
    case 'module-detail': return buildShell(buildModuleDetail());
    case 'quiz': return buildShell(buildQuiz());
    case 'analytics': return buildShell(buildAnalytics());
    case 'gamification': return buildShell(buildGamification());
    case 'admin': return buildShell(buildAdmin());
    default: return buildLanding();
  }
}

function buildQuiz(){
  questions=QUIZ_DATA[state.quizSubject];
  if(state.quizDone){
    const score=state.quizAnswers.filter((a,i)=>a===questions[i].ans).length;
    const pct=Math.round(score/questions.length*100);
    const cls=pct>=80?'good':pct>=60?'avg':'poor';
    const emoji=pct>=80?'🏆':pct>=60?'👍':'📚';
    return `
    <div style="max-width:580px;margin:0 auto">
      <div class="quiz-result">
        <h2 style="margin-bottom:20px">Quiz Complete! ${emoji}</h2>
        <div class="result-circle ${cls}"><div class="result-score">${pct}%</div></div>
        <div class="result-stats">
          <div class="rs-item"><strong style="color:var(--success)">${score}</strong><span>Correct</span></div>
          <div class="rs-item"><strong style="color:var(--danger)">${questions.length-score}</strong><span>Wrong</span></div>
          <div class="rs-item"><strong style="color:var(--primary)">${questions.length}</strong><span>Total</span></div>
        </div>
        <p style="font-size:14px;color:var(--muted);margin-bottom:24px">${pct>=80?'Outstanding performance! You\'ve mastered this topic.':pct>=60?'Good work! Review the topics you missed.':'Keep practicing! These concepts need more revision.'}</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-primary" data-action="retry-quiz">🔁 Retry Quiz</button>
          <button class="btn btn-secondary" data-nav="modules">📚 Back to Modules</button>
          <button class="btn btn-ghost btn-sm" data-nav="analytics">📊 View Analytics</button>
        </div>
      </div>
    </div>`;
  }
  const q=questions[state.quizQ];
  const letters=['A','B','C','D'];
  return `
  <div style="max-width:680px;margin:0 auto">
    <div class="quiz-header">
      <div class="quiz-progress-info">
        <div>
          <div style="font-size:14px;font-weight:700">Question ${state.quizQ+1} of ${questions.length}</div>
          <div style="font-size:12px;color:var(--muted)">${state.quizSubject==='math'?'Mathematics':'Science'} Quiz</div>
        </div>
        <div style="width:180px">
          <div class="progress-bar-wrap"><div class="progress-bar-fill pb-primary" style="width:${Math.round((state.quizQ/questions.length)*100)}%"></div></div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">Progress: ${state.quizQ} / ${questions.length}</div>
        </div>
      </div>
      <div class="timer-circle${state.quizTimer<=10?' urgent':''}">
        <div class="timer-val">${state.quizTimer}</div>
        <div class="timer-lbl">secs</div>
      </div>
    </div>
    <div class="question-card">
      <div class="question-num">Question ${state.quizQ+1} • ${q.diff}</div>
      <div class="question-text">${q.q}</div>
      <div class="options-grid">
        ${q.opts.map((o,i)=>{
          let cls='option-choice';
          if(state.quizShownExpl){
            if(i===q.ans)cls+=' correct';
            else if(i===state.quizSelected&&i!==q.ans)cls+=' wrong';
          }else if(i===state.quizSelected)cls+=' selected';
          return `<div class="${cls}" data-opt="${i}"><div class="option-letter">${letters[i]}</div>${o}</div>`;
        }).join('')}
      </div>
      ${state.quizShownExpl?`<div class="explanation-box${state.quizSelected!==q.ans?' wrong-ex':''}"><h4>${state.quizSelected===q.ans?'✓ Correct!':'✗ Incorrect'}</h4><p>${q.exp}</p></div>`:''}
    </div>
    ${state.quizShownExpl?`<button class="btn btn-primary btn-full" data-action="next-q">${state.quizQ<questions.length-1?'Next Question →':'See Results 🏆'}</button>`:'<p style="text-align:center;font-size:13px;color:var(--muted)">Select an answer above</p>'}
  </div>`;
}

function attachEvents(){
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>navigate(el.dataset.page));
  });
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.nav==='quiz'){state.quizQ=0;state.quizAnswers=[];state.quizSelected=null;state.quizShownExpl=false;state.quizDone=false;state.quizTimer=30;}
      navigate(el.dataset.nav);
    });
  });
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',e=>{
      switch(el.dataset.action){
        case 'signup': doSignup();break;
        case 'login': doLogin();break;
        case 'logout': doLogout();break;
        case 'complete-onboarding': doOnboarding();break;
        case 'mark-complete': markComplete(parseInt(el.dataset.module));break;
        case 'add-note': addNote();break;
        case 'next-q': nextQuizQuestion();break;
        case 'prev-chapter': state.currentChapter=Math.max(0,state.currentChapter-1);render();break;
        case 'next-chapter': state.currentChapter=Math.min(state.currentModule.chapters.length-1,state.currentChapter+1);render();break;
        case 'retry-quiz': state.quizQ=0;state.quizAnswers=[];state.quizSelected=null;state.quizShownExpl=false;state.quizDone=false;startQuizTimer();render();break;
        case 'start-quiz': state.quizSubject=el.dataset.subj||'math';state.quizQ=0;state.quizAnswers=[];state.quizSelected=null;state.quizShownExpl=false;state.quizDone=false;navigate('quiz');break;
      }
    });
  });
  document.querySelectorAll('[data-module]').forEach(el=>{
    el.addEventListener('click',()=>{
      const mod=MODULES_DATA.find(m=>m.id===parseInt(el.dataset.module));
      if(mod){state.currentModule=mod;state.currentChapter=0;navigate('module-detail')}
    });
  });
  document.querySelectorAll('[data-goal]').forEach(el=>{
    el.addEventListener('click',()=>toggleGoal(parseInt(el.dataset.goal)));
  });
  document.querySelectorAll('[data-lang]').forEach(el=>{
    el.addEventListener('click',()=>{state.lang=el.dataset.lang;render();if(state.page==='analytics')setTimeout(renderCharts,200)});
  });
  document.querySelectorAll('[data-class]').forEach(el=>{
    el.addEventListener('click',()=>{state.onboardData.class=el.dataset.class;render()});
  });
  document.querySelectorAll('[data-medium]').forEach(el=>{
    el.addEventListener('click',()=>{state.onboardData.medium=el.dataset.medium;render()});
  });
  document.querySelectorAll('[data-interest]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=el.dataset.interest;
      const arr=state.onboardData.interests;
      const idx=arr.indexOf(i);
      if(idx>=0)arr.splice(idx,1);else arr.push(i);
      render();
    });
  });
  document.querySelectorAll('[data-goal]').forEach(el=>{
    if(el.dataset.goal&&isNaN(parseInt(el.dataset.goal))){
      el.addEventListener('click',()=>{state.onboardData.goal=el.dataset.goal;render()});
    }
  });
  const optBtns=document.querySelectorAll('.option-btn[data-goal]');
  optBtns.forEach(el=>{
    el.addEventListener('click',()=>{state.onboardData.goal=el.dataset.goal;render()});
  });
  document.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(!state.quizShownExpl)selectQuizAnswer(parseInt(el.dataset.opt));
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{state.analyticsToggle=el.dataset.toggle;render();setTimeout(renderCharts,100)});
  });
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      const f=el.dataset.filter;
      document.querySelectorAll('#modules-grid .module-card').forEach(card=>{
        const subj=card.querySelector('.module-subject')?.textContent;
        card.style.display=(f==='All'||subj===f)?'':'none';
      });
    });
  });
  document.querySelectorAll('[data-chapter]').forEach(el=>{
    el.addEventListener('click',()=>{state.currentChapter=parseInt(el.dataset.chapter);render()});
  });
  const menuToggle=document.getElementById('menu-toggle');
  if(menuToggle)menuToggle.addEventListener('click',()=>{state.sidebarOpen=!state.sidebarOpen;const sb=document.getElementById('sidebar');if(sb)sb.classList.toggle('open',state.sidebarOpen)});
  const searchInput=document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input',e=>{
      const q=e.target.value.toLowerCase();
      if(!q)return;
      const match=MODULES_DATA.find(m=>m.title.toLowerCase().includes(q)||m.subject.toLowerCase().includes(q));
      if(match)setTimeout(()=>{state.currentModule=match;state.currentChapter=0;navigate('module-detail')},500);
    });
  }
}

render();
</script>
